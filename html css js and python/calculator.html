<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/calculator.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <h1>Calculator Project</h1>

        <div class="cal-con">
            <h2 id="displayNum">0</h2>
            <h4 onclick="formNumber(7)">7</h4>
            <h4 onclick="formNumber(8)">8</h4>
            <h4 onclick="formNumber(9)">9</h4>
            <h4 onclick="formNumber(4)">4</h4>
            <h4 onclick="formNumber(5)">5</h4>
            <h4 onclick="formNumber(6)">6</h4>
            <h4 onclick="formNumber(1)">1</h4>
            <h4 onclick="formNumber(2)">2</h4>
            <h4 onclick="formNumber(3)">3</h4>
            <h4 onclick="formNumber(0)" style="grid-row: 5/6; grid-column: 1/3;">0</h4>
            <h4 onclick="formNumber('.')">.</h4>
            <h4 onclick="opDiv()" style="grid-row:2/3; grid-column: 4/5;" class="operator-btn">/</h4>
            <h4 onclick="opMul()" style="grid-row:3/4; grid-column: 4/5;" class="operator-btn">x</h4>
            <h4 onclick="opSum()" style="grid-row:4/5; grid-column: 4/5;" class="operator-btn">+</h4>
            <h4 onclick="opSub()" style="grid-row:5/6; grid-column: 4/5;" class="operator-btn">-</h4>
            <h4 id="equal" style="grid-row:6/7; grid-column: 1/5;" class="operator-btn">=</h4>
        </div>
    </div>


    <form action="#">
        <input type="text" placeholder="First name" id="fname">
        <input type="text" placeholder="Second Name" id="lname">
        <button onclick="submitForm()" type="button">Submit</button>
    </form>
    <h2 id="displayUser">No users</h2>


    <script type="text/javascript" src="js/calculator.js"></script>
</body>
</html>
